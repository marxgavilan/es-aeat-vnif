name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, intl, mbstring, openssl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Formatter
        run: composer format:check

      - name: PHPStan
        run: composer analyse

      - name: Tests
        run: composer test

      - name: Doctor without certificate fails clearly
        run: |
          set +e
          bin/aeat-vnif doctor
          code=$?
          set -e
          test "$code" -ne 0
